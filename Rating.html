<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SE Care+ | ให้คะแนนการบริการ</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- Google Font: Kanit -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 500px;
      margin-top: 10px;
    }

    .rating-group {
      margin-bottom: 30px;
    }

    .rating-stars i {
      cursor: pointer;
      font-size: 40px;
      color: #ccc;
      transition: color 0.2s;
    }

    .rating-stars i.active {
      color: gold !important;
    }

    button[type="submit"] {
      background-color: #00315F;
      border: none;
      border-radius: 8px;
      color: white;
      padding: 10px 30px;
      font-size: 18px;
    }
    
    button[type="submit"]:disabled {
      background-color: #ccc !important;
      color: #666 !important;
      cursor: not-allowed;
      opacity: 0.7;
    }
    
    button[type="submit"]:not(:disabled):hover {
      background-color: #00315F;
      color: white;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 50px;
    }
  </style>
</head>
<center>
  <img src="https://cdn.jsdelivr.net/gh/civicshop/secareplus/rating.webp" style="width: 100px; height: auto; padding: 10px;"/>
    <h2>ให้คะแนนการบริการ</h2>

  <p class="text-sub" id="subTitle">
  เพื่อพัฒนาการบริการให้ดียิ่งขึ้น รบกวนให้คะแนนความพึงพอใจในการแก้ไขงานครั้งนี้ด้วยนะคะ
</p>
</center>
    
  </div>
  <div class="container text-center">
<body>
	<!-- เพิ่มข้อมูล -->
	<input type="hidden" id="jobId" />
	<input type="hidden" id="uid" />
	
    <div class="rating-group text-center">
      <h4>ระบบแจ้งซ่อม</h4>
      <div class="rating-stars" data-category="system">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <div class="rating-group text-center">
      <h4>พนักงานที่ให้บริการ</h4>
      <div class="rating-stars" data-category="staff">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <div class="rating-group text-center">
      <h4>คุณภาพงานซ่อม</h4>
      <div class="rating-stars" data-category="quality">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>
    <button type="submit" class="btn" id="submitRating" disabled>ส่งคะแนน</button>
  </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
let liffReady = false;
let userId = '';

// ==============================
// ✅ INIT หลัง DOM โหลด
// ==============================
document.addEventListener("DOMContentLoaded", async () => {
  await initLIFF();
  initPage();
});


// ==============================
// ✅ INIT LIFF
// ==============================
async function initLIFF() {
  try {
    await liff.init({ liffId: "2007065360-Myoply7Y" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    userId = profile.userId;

    liffReady = true;
    console.log("LIFF ready:", userId);

  } catch (err) {
    console.error("LIFF init error:", err);
    alert("โหลดระบบไม่สำเร็จ กรุณาเปิดผ่าน LINE");
  }
}


// ==============================
// ✅ INIT PAGE
// ==============================
function initPage() {
  const urlParams = new URLSearchParams(window.location.search);

  setVal('jobID', urlParams.get('jobID'));
  setVal('uid', urlParams.get('uid'));
}

function setVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val || '';
}

// ==============================
// ⭐ RATING
// ==============================
const submitBtn = document.getElementById('submitRating');
submitBtn.disabled = true;

const scores = {
  system: 0,
  staff: 0,
  quality: 0
};

document.querySelectorAll('.rating-stars').forEach(group => {
  const category = group.getAttribute('data-category');
  const stars = group.querySelectorAll('i');

  stars.forEach(star => {
    star.addEventListener('click', function () {
      const score = parseInt(this.getAttribute('data-score'));
      scores[category] = score;
      updateStars(stars, score);
      checkAllRated();
    });
  });
});

function updateStars(stars, score) {
  stars.forEach(star => {
    const s = parseInt(star.getAttribute('data-score'));
    star.classList.toggle('active', s <= score);
  });
}

function checkAllRated() {
  submitBtn.disabled = !Object.values(scores).every(s => s > 0);
}


// ==============================
// 🚀 SUBMIT (กัน request หาย)
// ==============================
submitBtn.addEventListener('click', async () => {

  if (!liffReady) {
    alert("ระบบยังไม่พร้อม กรุณาลองใหม่");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerText = "กำลังส่ง...";

  const scriptUrl = 'https://script.google.com/macros/s/AKfycbygcn50APZCGEMe1CsNTPb-Soe_XZ_uMWAqeB-oTSs5J4iVb5R353SLz0ZSsTTIv7kP/exec';
  const urlParams = new URLSearchParams(window.location.search);

  const uid = userId || urlParams.get('uid') || 'mock-uid';

  const payload = new URLSearchParams({
    opt: 'saverating',
    uid: uid,
    jobID: urlParams.get('jobID') || '',
    system: scores.system,
    staff: scores.staff,
    quality: scores.quality
  });

  try {
    // ==============================
    // ✅ timeout กันค้าง
    // ==============================
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    const res = await fetch(scriptUrl, {
      method: 'POST',
      body: payload,
      signal: controller.signal
    });

    clearTimeout(timeout);

    const result = await res.json();
    console.log("GAS:", result);

    if (result.status !== 'success') {
      throw new Error(result.message || 'บันทึกไม่สำเร็จ');
    }

    await Swal.fire({
      icon: 'success',
      title: 'ขอบคุณสำหรับการประเมิน',
      confirmButtonColor: '#00315F'
    });

    if (liff.isInClient()) {
      liff.closeWindow();
    }

  } catch (err) {
    console.error("ERROR:", err);

    Swal.fire({
      icon: 'error',
      title: 'ส่งไม่สำเร็จ',
      text: err.message
    });

    submitBtn.disabled = false;
    submitBtn.innerText = "ส่งคะแนน";
  }
});
</script>
  
</body>

</html>
