<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SE Care+ | ประเมินความพึงพอใจ</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 500px;
      margin-top: 50px;
      margin-bottom: 50px;
    }

    .rating-group {
      margin-bottom: 30px;
    }

    .rating-stars i {
      cursor: pointer;
      font-size: 40px;
      color: #ccc;
      transition: color 0.2s;
      margin: 0 2px;
    }

    .rating-stars i.active {
      color: gold !important;
    }

    button[type="button"] {
      background-color: #00315F;
      border: none;
      border-radius: 8px;
      color: white;
      padding: 10px 30px;
      font-size: 18px;
      min-width: 180px;
    }

    button[type="button"]:disabled {
      opacity: 0.7;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <div class="container text-center">

    <h6 class="my-3">เพื่อปรับปรุงการให้บริการให้ดียิ่งขึ้น</h6>
    <h6 class="my-3">รบกวนช่วยประเมินความพึงพอใจในการรับบริการครั้งนี้ด้วยนะคะ</h6>

    <!-- Hidden Fields -->
    <input type="hidden" id="jobId" />
    <input type="hidden" id="project" />
    <input type="hidden" id="uid" />
    <input type="hidden" id="customer" />
    <input type="hidden" id="plot" />

    <!-- ระบบแจ้งซ่อม -->
    <div class="rating-group text-center">
      <strong>ระบบแจ้งซ่อม</strong>

      <div class="rating-stars" data-category="system">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <!-- พนักงาน -->
    <div class="rating-group text-center">
      <strong>พนักงานที่ให้บริการ</strong>

      <div class="rating-stars" data-category="staff">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <!-- คุณภาพงาน -->
    <div class="rating-group text-center">
      <strong>คุณภาพงานซ่อม</strong>

      <div class="rating-stars" data-category="quality">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <!-- Submit -->
    <button type="button" class="btn" id="submitRating" disabled>
      ส่งคะแนน
    </button>

    <div class="footer">
      SE Care+ Service
    </div>

  </div>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>

    // =========================
    // CONFIG
    // =========================

    const scriptUrl =
      'https://script.google.com/macros/s/AKfycby8n3nbtSaNvWuuF7dVtWWvNZq7y0vFbx5NwnDjjKd8p-nw5seor3UplSIFfEaSsLfsUg/exec';

    // =========================
    // GET URL PARAMS
    // =========================

    const urlParams = new URLSearchParams(window.location.search);

    const jobId = urlParams.get('jobId') || '';
    const project = urlParams.get('project') || '';
    const uid = urlParams.get('uid') || '';
    const plot = urlParams.get('plot') || '';

    const customer = decodeURIComponent(
      urlParams.get('customer') || ''
    );

    // =========================
    // SET HIDDEN VALUES
    // =========================

    document.getElementById('jobId').value = jobId;
    document.getElementById('project').value = project;
    document.getElementById('uid').value = uid;
    document.getElementById('customer').value = customer;
    document.getElementById('plot').value = plot;

    // =========================
    // VALIDATE REQUIRED PARAM
    // =========================

    if (!jobId) {

      Swal.fire({
        icon: 'error',
        title: 'ไม่พบ Job ID',
        text: 'กรุณาเปิดลิงก์ใหม่อีกครั้ง'
      });

      throw new Error('Missing jobId');

    }

    // =========================
    // ELEMENTS
    // =========================

    const submitBtn = document.getElementById('submitRating');

    // =========================
    // SCORE DATA
    // =========================

    const scores = {
      system: 0,
      staff: 0,
      quality: 0
    };

    // =========================
    // PREVENT DOUBLE SUBMIT
    // =========================

    let isSubmitting = false;

    // =========================
    // STAR EVENTS
    // =========================

    document.querySelectorAll('.rating-stars').forEach(group => {

      const category = group.getAttribute('data-category');
      const stars = group.querySelectorAll('i');

      stars.forEach(star => {

        star.addEventListener('click', function () {

          const score = parseInt(
            this.getAttribute('data-score')
          );

          scores[category] = score;

          updateStars(stars, score);

          checkAllRated();

        });

      });

    });

    // =========================
    // UPDATE STAR UI
    // =========================

    function updateStars(stars, score) {

      stars.forEach(star => {

        const s = parseInt(
          star.getAttribute('data-score')
        );

        star.classList.toggle('active', s <= score);

      });

    }

    // =========================
    // ENABLE BUTTON
    // =========================

    function checkAllRated() {

      const allRated = Object.values(scores)
        .every(score => score > 0);

      submitBtn.disabled = !allRated;

    }

    // =========================
    // SUBMIT EVENT
    // =========================

    submitBtn.addEventListener('click', async () => {

      // กันกดซ้ำ
      if (isSubmitting) return;

      isSubmitting = true;

      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังส่ง...';

      try {

        // =========================
        // SEND TO GAS
        // =========================

        const response = await fetch(scriptUrl, {

          method: 'POST',

          mode: 'cors',

          body: new URLSearchParams({

            opt: 'saverating',

            uid: uid,

            project: project,

            jobID: jobId,

            plot: plot,

            customer: customer,

            system: scores.system,

            staff: scores.staff,

            quality: scores.quality

          })

        });

        // =========================
        // CHECK RESPONSE
        // =========================

        if (!response.ok) {
          throw new Error(
            'HTTP Error : ' + response.status
          );
        }

        const result = await response.text();

        console.log('GAS Response:', result);

        // =========================
        // SUCCESS ALERT
        // =========================

        await Swal.fire({

          icon: 'success',

          title: 'ส่งคะแนนสำเร็จ',

          html: `
            <div style="text-align:left">
              ระบบแจ้งซ่อม: ${scores.system} ดาว<br/>
              พนักงานที่ให้บริการ: ${scores.staff} ดาว<br/>
              คุณภาพงานซ่อม: ${scores.quality} ดาว
            </div>
          `,

          confirmButtonColor: '#00315F'

        });

        // =========================
        // UPDATE BUTTON
        // =========================

        submitBtn.innerText = 'ส่งคะแนนแล้ว';

      } catch (error) {

        console.error('Submit Error:', error);

        isSubmitting = false;

        submitBtn.disabled = false;

        submitBtn.innerText = 'ส่งคะแนน';

        Swal.fire({

          icon: 'error',

          title: 'ส่งข้อมูลไม่สำเร็จ',

          text: error.message || 'กรุณาลองใหม่อีกครั้ง'

        });

      }

    });

  </script>

</body>

</html>
