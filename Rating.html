<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SE Care+ | ประเมินความพึงพอใจ</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- Google Font: Kanit -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 500px;
      margin-top: 50px;
    }

    .rating-group {
      margin-bottom: 30px;
    }

    .rating-stars i {
      cursor: pointer;
      font-size: 40px;
      color: #ccc;
      transition: color 0.2s;
    }

    .rating-stars i.active {
      color: gold !important;
    }

    button[type="submit"] {
      background-color: #00315F;
      border: none;
      border-radius: 8px;
      color: white;
      padding: 10px 30px;
      font-size: 18px;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 50px;
    }
  </style>
</head>
  <div class="container text-center">
    <h6 class="my-3">เพื่อปรับปรุงการให้บริการให้ดียิ่งขึ้น</h6>
	<h6 class="my-3">รบกวนช่วยประเมินความพึงพอใจในการรับบริการครั้งนี้ด้วยนะคะ</h6>
<body>
	<!-- เพิ่มข้อมูล -->
	<input type="hidden" id="jobId" />
	<input type="hidden" id="project" />
	<input type="hidden" id="uid" />
	<input type="hidden" id="customer" value="ชื่อผู้ใช้" />

    <div class="rating-group text-center">
      <strong>ระบบแจ้งซ่อม</strong>
      <div class="rating-stars" data-category="system">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <div class="rating-group text-center">
      <strong>พนักงานที่ให้บริการ</strong>
      <div class="rating-stars" data-category="staff">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>

    <div class="rating-group text-center">
      <strong>คุณภาพงานซ่อม</strong>
      <div class="rating-stars" data-category="quality">
        <i class="bi bi-star-fill" data-score="1"></i>
        <i class="bi bi-star-fill" data-score="2"></i>
        <i class="bi bi-star-fill" data-score="3"></i>
        <i class="bi bi-star-fill" data-score="4"></i>
        <i class="bi bi-star-fill" data-score="5"></i>
      </div>
    </div>
    <button type="submit" class="btn" id="submitRating" disabled>ส่งคะแนน</button>
  </div>
	
	<input type="hidden" id="plot" />
	
  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    
	// ดึง query string จาก URL
	const urlParams = new URLSearchParams(window.location.search);
	document.getElementById('jobId').value = urlParams.get('jobId') || '';
	document.getElementById('project').value = urlParams.get('project') || '';
	document.getElementById('uid').value = urlParams.get('uid') || '';
	document.getElementById('customer').value = urlParams.get('customer') || '';
	document.getElementById('plot').value = urlParams.get('plot') || ''; // ✅ เพิ่มบรรทัดนี้

	
	const submitBtn = document.getElementById('submitRating');
    const scores = {
      system: 0,
      staff: 0,
      quality: 0
    };

    document.querySelectorAll('.rating-stars').forEach(group => {
      const category = group.getAttribute('data-category');
      const stars = group.querySelectorAll('i');

      stars.forEach(star => {
        star.addEventListener('click', function () {
          const score = parseInt(this.getAttribute('data-score'));
          scores[category] = score;
          updateStars(stars, score);
          checkAllRated();
        });
      });
    });

    function updateStars(stars, score) {
      stars.forEach(star => {
        const s = parseInt(star.getAttribute('data-score'));
        star.classList.toggle('active', s <= score);
      });
    }

    function checkAllRated() {
      const allRated = Object.values(scores).every(score => score > 0);
      submitBtn.disabled = !allRated;
    }

    submitBtn.addEventListener('click', () => {
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังส่ง...";

      Swal.fire({
        icon: 'success',
        title: 'ขอบคุณสำหรับการประเมิน',
        html: `
          <div style="text-align:left">
            ระบบแจ้งซ่อม: ${scores.system} ดาว<br/>
            พนักงานที่ให้บริการ: ${scores.staff} ดาว<br/>
            คุณภาพงานซ่อม: ${scores.quality} ดาว
          </div>
        `,
        confirmButtonColor: '#00315F'
      });

      // === ส่งไปยัง GAS ===
      const scriptUrl = 'https://script.google.com/macros/s/AKfycby8n3nbtSaNvWuuF7dVtWWvNZq7y0vFbx5NwnDjjKd8p-nw5seor3UplSIFfEaSsLfsUg/exec'; // เปลี่ยนตามจริง
      const uid = urlParams.get('uid') || 'mock-uid';

fetch(scriptUrl, {
  method: 'POST',
  body: new URLSearchParams({
    opt: 'saverating',
    uid: uid,
    project: urlParams.get('project') || '',
    jobID: urlParams.get('jobId') || '',
    plot: urlParams.get('plot') || '',
    customer: urlParams.get('customer') || '',
    system: scores.system,
    staff: scores.staff,
    quality: scores.quality
  })
      }).finally(() => {
        submitBtn.innerText = "ส่งคะแนนแล้ว";
      });
    });
  </script>
</body>

</html>
