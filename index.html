<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SE Care+</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body { font-family: 'Kanit', sans-serif; background: #fff; }
    .container { max-width: 600px; }
    button[type="submit"] {
      width: 50%; margin: 0 auto; padding: 10px;
      background: #00315F; border: none; border-radius: 10px; color: #fff;
    }
  </style>
</head>

<body>

<center>
  <br />
  <img src="https://drive.google.com/uc?id=1tqIcibN2LgEr8ct8cm3LLHhHoFh1CqaN" width="100">
  <h3>แจ้งซ่อมออนไลน์</h3>
</center>

<div class="container">
<form id="myForm" class="needs-validation" novalidate>

  <select class="form-select mb-2" id="project" required>
    <option disabled selected value="">เลือกโครงการ</option>
    <option value="ดิ อิเธอร์นิตี้ กรีนวู้ด รังสิต-วงแหวน">ดิ อิเธอร์นิตี้ กรีนวู้ด</option>
  </select>

  <input class="form-control mb-2" id="plot" placeholder="123/456" required>
  <input class="form-control mb-2" id="name" placeholder="ชื่อ" required>

  <!-- 🔥 แก้ -->
  <input type="tel" class="form-control mb-2" id="tel" placeholder="0888888888" required>

  <textarea class="form-control mb-2" id="defect" placeholder="รายละเอียด" required></textarea>

  <!-- 🔥 แก้ -->
  <input type="file" id="file" class="form-control mb-2"
    accept="image/*" capture="environment" required>

  <div class="text-center">
    <button type="submit">ส่งข้อมูล</button>
  </div>

</form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
const scriptUrl = 'https://script.google.com/macros/s/AKfycbygcn50APZCGEMe1CsNTPb-Soe_XZ_uMWAqeB-oTSs5J4iVb5R353SLz0ZSsTTIv7kP/exec';

// 🔥 resize แบบใหม่ (กันพังมือถือ)
function resizeImage(file) {
  return new Promise((resolve, reject) => {

    if (file.size > 5 * 1024 * 1024) {
      return reject("รูปใหญ่เกิน 5MB");
    }

    const reader = new FileReader();

    reader.onload = e => {
      const img = new Image();

      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          const MAX = 800;
          let w = img.width;
          let h = img.height;

          if (w > h && w > MAX) {
            h *= MAX / w;
            w = MAX;
          } else if (h > MAX) {
            w *= MAX / h;
            h = MAX;
          }

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          const base64 = canvas.toDataURL("image/jpeg", 0.7);
          resolve(base64.split(',')[1]);

        } catch (err) {
          reject("แปลงรูปไม่สำเร็จ");
        }
      };

      img.onerror = () => reject("ไฟล์รูปไม่รองรับ");
      img.src = e.target.result;
    };

    reader.onerror = () => reject("อ่านไฟล์ไม่ได้");
    reader.readAsDataURL(file);
  });
}

// 🔥 submit
async function submitForm() {

  const btn = document.querySelector("button");
  btn.disabled = true;

  Swal.fire({title:"กำลังส่ง...", allowOutsideClick:false, didOpen:()=>Swal.showLoading()});

  try {

    // 🔥 LIFF login
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();

    const file = document.getElementById("file").files[0];
    const base64 = await resizeImage(file);

    const data = {
      uid: profile.userId,
      project: $("#project").val(),
      plot: $("#plot").val(),
      name: $("#name").val(),
      tel: $("#tel").val(),
      defect: $("#defect").val(),
      file: base64
    };

    await $.ajax({
      method: "POST",
      url: scriptUrl,
      data: JSON.stringify(data),
      contentType: "application/json"
    });

    Swal.fire("สำเร็จ", "ส่งข้อมูลแล้ว", "success");
    $("#myForm")[0].reset();

  } catch (err) {
    console.error(err);
    Swal.fire("ผิดพลาด", err, "error");
  }

  btn.disabled = false;
}

// validate + submit
document.getElementById("myForm").addEventListener("submit", function(e){
  e.preventDefault();

  if (!this.checkValidity()) {
    this.classList.add("was-validated");
    return;
  }

  submitForm();
});

// init LIFF
document.addEventListener("DOMContentLoaded", () => {
  liff.init({ liffId: "2007065360-n1loYJ1G" });
});
</script>

</body>
</html>
