              <div style="display:flex;gap:10px;justify-content:center;">
                <div>เลขที่อ้างอิง</div>
                <div style="background:#ff5722;color:#fff;padding:6px 14px;border-radius:8px;">
                  ${res.jobID}
                </div>
              </div>
            `
          });

        } else {
          throw new Error("API ไม่สำเร็จ");
        }
      },

      error: function () {
        Swal.close();
        submitBtn.disabled = false;

        Swal.fire('Error', 'ส่งข้อมูลไม่สำเร็จ (เน็ตหรือเซิร์ฟเวอร์)', 'error');
      }
    });

  } catch (error) {
    Swal.close();
    submitBtn.disabled = false;

    console.error("ERROR:", error);

    Swal.fire({
      icon: 'error',
      title: 'เกิดข้อผิดพลาด',
      text: error.message
    });
  }
}

// ================== INIT (หัวใจสำคัญ) ==================
document.addEventListener("DOMContentLoaded", async function () {

  const submitBtn = document.querySelector('button[type="submit"]');
  submitBtn.disabled = true;

  // 🔒 lock screen
  Swal.fire({
    title: 'กำลังโหลดระบบ...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  try {
    // ✅ กัน init ค้าง
    await Promise.race([
      liff.init({
        liffId: '2007065360-n1loYJ1G',
        withLoginOnExternalBrowser: true
      }),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error("LIFF init timeout")), 5000)
      )
    ]);

    console.log("LIFF READY");

    // ✅ login flow
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    // ✅ test profile
    const profile = await liff.getProfile();
    console.log("USER:", profile.userId);

    // ✅ ready
    liffReady = true;

    Swal.close();
    submitBtn.disabled = false;

  } catch (err) {
    console.error("LIFF ERROR:", err);

    Swal.fire({
      icon: 'error',
      title: 'โหลดระบบไม่สำเร็จ',
      text: 'กรุณาปิดแล้วเปิดใหม่ใน LINE'
    });

    // 🔁 reload กันค้าง
    setTimeout(() => location.reload(), 3000);
  }

  // ================== FORM ==================
  const forms = document.querySelectorAll('.needs-validation');

  forms.forEach(form => {
    form.addEventListener('submit', event => {
      event.preventDefault();

      const plot = $('#plot').val().trim();
      const tel = $('#tel').val().trim();

      const plotRegex = /^[0-9]+\/[0-9]+$/;
      const telRegex = /^0[0-9]{9}$/;

      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      if (!plotRegex.test(plot)) {
        Swal.fire('บ้านเลขที่ไม่ถูกต้อง', '', 'warning');
        return;
      }

      if (!telRegex.test(tel)) {
        Swal.fire('เบอร์โทรไม่ถูกต้อง', '', 'warning');
        return;
      }

      submit();
    });
  });

});
</script>
