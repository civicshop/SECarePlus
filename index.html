<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>SE Care+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

  <h2>แจ้งซ่อม</h2>

  <!-- ✅ ต้องมี form -->
  <form id="repairForm">
    <input type="text" name="name" placeholder="ชื่อ" required><br><br>
    <input type="text" name="phone" placeholder="เบอร์โทร" required><br><br>
    <textarea name="detail" placeholder="รายละเอียด" required></textarea><br><br>
    <input type="file" name="image" accept="image/*"><br><br>

    <button type="button" onclick="submit()">ส่งข้อมูล</button>
  </form>

<script>
const scriptUrl = "https://script.google.com/macros/s/AKfycbygcn50APZCGEMe1CsNTPb-Soe_XZ_uMWAqeB-oTSs5J4iVb5R353SLz0ZSsTTIv7kP/exec"; // 🔥 ใส่ URL GAS

async function submit() {
  try {
    console.log("=== START SUBMIT ===");

    // ✅ สร้าง formData (แก้ error ที่คุณเจอ)
    const form = document.getElementById("repairForm");
    const formData = new FormData(form);

    // debug ดูค่าที่ส่ง
    for (let pair of formData.entries()) {
      console.log(pair[0]+ ': ' + pair[1]);
    }

    // ✅ กันกดซ้ำ
    const btn = document.querySelector('button');
    btn.disabled = true;

    // ✅ timeout
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);

    const res = await fetch(scriptUrl, {
      method: 'POST',
      body: formData,
      signal: controller.signal
    });

    clearTimeout(timeout);

    console.log("STATUS:", res.status);

    if (!res.ok) {
      throw new Error("HTTP ERROR: " + res.status);
    }

    const text = await res.text();
    console.log("RAW RESPONSE:", text);

    let data;
    try {
      data = JSON.parse(text.trim());
    } catch (e) {
      console.error("❌ JSON ERROR:", text);
      throw new Error("Response ไม่ใช่ JSON");
    }

    console.log("PARSED:", data);

    if (!data || data.status !== 'success') {
      throw new Error(data?.message || "GAS error");
    }

    // ✅ success
    await Swal.fire({
      icon: 'success',
      title: 'ส่งข้อมูลสำเร็จ',
      timer: 1500,
      showConfirmButton: false
    });

    // ✅ ปิด LIFF
    if (window.liff && liff.isInClient()) {
      liff.closeWindow();
    }

  } catch (err) {
    console.error("🔥 ERROR:", err);

    let msg = err.message;

    if (err.name === 'AbortError') {
      msg = "ระบบใช้เวลานานเกินไป";
    } else if (msg.includes("Failed to fetch")) {
      msg = "อินเทอร์เน็ตหรือ LINE มีปัญหา";
    }

    Swal.fire({
      icon: 'error',
      title: 'เกิดข้อผิดพลาด',
      text: msg
    });

  } finally {
    document.querySelector('button').disabled = false;
  }
}

// ✅ init LIFF
async function initLIFF() {
  try {
    await liff.init({ liffId: "2007065360-n1loYJ1G" });
    console.log("LIFF READY");
  } catch (err) {
    console.error("LIFF ERROR", err);
    alert("โหลด LIFF ไม่สำเร็จ");
  }
}

initLIFF();
</script>

</body>
</html>
