    'ดิ อิเธอร์นิตี้ อาร์ค สุขาภิบาล 5': '564/',
    'เดอะ คราวน์ เรสซิเดนท์เซส พระราม 4': '1/',
  };

  function resizeImage(file, maxSize = 800) {
    return new Promise((resolve, reject) => {
        if (!file.type.match(/image.*/)) {
            reject(new Error("ไฟล์ที่เลือกไม่ใช่รูปภาพ"));
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxSize) {
                        height *= maxSize / width;
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width *= maxSize / height;
                        height = maxSize;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // ปรับคุณภาพลงเหลือ 0.6 เพื่อลดภาระการส่งข้อมูลบนมือถือ
                const base64 = canvas.toDataURL('image/jpeg', 0.6);
                resolve(base64.split(',')[1]); // เอาเฉพาะ data base64
            };
            img.onerror = () => reject(new Error("โหลดรูปภาพไม่สำเร็จ"));
            img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error("อ่านไฟล์ไม่ได้"));
        reader.readAsDataURL(file);
    });
}

  async function submit() {
    const submitBtn = document.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    Swal.fire({
      title: 'กำลังบันทึกข้อมูล',
      text: 'กรุณารอสักครู่...',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    const fileInput = $('#file')[0];
    if (fileInput.files.length === 0) {
      Swal.close();
      alert('กรุณาเลือกไฟล์รูปภาพ');
      submitBtn.disabled = false;
      return;
    }

    try {
      const file = fileInput.files[0];
      const resizedBase64 = await resizeImage(file);

      const data = {
        opt: 'savedata',
        uid: liff.getDecodedIDToken().sub,
        project: $('#project').val(),
        plot: $('#plot').val(),
        name: $('#name').val(),
        tel: $('#tel').val(),
        defect: $('#defect').val(),
        file: resizedBase64,
      };

      $.ajax({
        method: "POST",
        url: scriptUrl,
        data: data,
        dataType: 'json',
        success: function (res) {
          Swal.close();
          submitBtn.disabled = false;
          if (res.status == 'success') {
            $('#myForm')[0].reset();
            Swal.fire({
              icon: 'success',
              title: 'บันทึกข้อมูลเรียบร้อย',
              html: `
                <div style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 18px;">
                  <div>เลขที่อ้างอิง</div>
                  <div style="background-color: #ff5722; color: white; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 18px;">
                    ${res.jobID}
                  </div>
                </div>
              `,
              confirmButtonText: 'ตกลง',
              confirmButtonColor: '#00315F',
              allowOutsideClick: false,
            });
          } else {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', confirmButtonText: 'ตกลง' });
          }
        },
        error: function () {
          Swal.close();
          submitBtn.disabled = false;
          alert('บันทึกข้อมูลไม่สำเร็จ');
        }
      });
    } catch (error) {
      Swal.close();
      submitBtn.disabled = false;
      console.error(error);
      alert('เกิดข้อผิดพลาดในการประมวลผลรูปภาพ');
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    liff.init({
      liffId: '2007065360-n1loYJ1G',
      withLoginOnExternalBrowser: true
    }).then(() => {
      console.log('liff ready');
    });

    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        event.preventDefault();

        const plotValue = $('#plot').val().trim();
        const telValue = $('#tel').val().trim();
        const projectValue = $('#project').val();
        const expectedPrefix = projectPlotPrefixes[projectValue];

        const plotRegex = /^[0-9]+\/[0-9]+$/;
        const telRegex = /^0[0-9]{9}$/;

        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          $('#myForm').find(":invalid").first().focus();
        } else if (!plotRegex.test(plotValue)) {
          Swal.fire('รูปแบบบ้านเลขที่ไม่ถูกต้อง', 'กรุณากรอกบ้านเลขที่ เช่น 123/456 โดยไม่มีตัวอักษร', 'warning');
          $('#plot').focus();
        } else if (expectedPrefix && !plotValue.startsWith(expectedPrefix)) {
          Swal.fire('บ้านเลขที่ไม่ถูกต้อง', `บ้านเลขที่ของโครงการ "${projectValue}" ต้องขึ้นต้นด้วย "${expectedPrefix}"`, 'warning');
          $('#plot').focus();
        } else if (!telRegex.test(telValue)) {
          Swal.fire('เบอร์โทรศัพท์ไม่ถูกต้อง', 'กรุณากรอกเบอร์โทรศัพท์ 10 หลัก โดยขึ้นต้นด้วย 0', 'warning');
          $('#tel').focus();
        } else {
          submit();
        }
      }, false);
    });
  });
</script>
